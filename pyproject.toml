[project]
name = "dpdp-erasure-eval"
version = "0.1.0"
description = "DPDP erasure evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "anthropic>=0.49.0,<1",
    "google-genai>=1.14.0,<2",
]

[project.scripts]
dpdp-eval = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default merge gate excludes opt-in live provider smoke; run explicitly with -m live.
addopts = "-m 'not live'"
markers = [
    "live: opt-in live provider smoke tests requiring API keys (excluded from CI)",
    "refresh: opt-in cache refresh tests requiring CACHE_MODE=refresh",
    "cache_miss: offline cache miss behavior tests",
    "context_isolation: context-scoped label isolation tests",
    "tool_isolation: tool-scoped label isolation tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "report", "cli", "runners"]
